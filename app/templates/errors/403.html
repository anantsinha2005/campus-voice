{% extends 'base.html' %}

{% block title %}403 Forbidden - Campus Voice{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-12 col-md-8 col-lg-6 text-center">
    <div class="card card-academic border-0 shadow-sm p-4">
      <div class="text-danger mb-3">
        <i class="bi bi-shield-x" style="font-size: 4rem;"></i>
      </div>
      <h2 class="fw-bold text-dark">403 - Access Prohibited</h2>
      <p class="text-muted mb-4">
        You do not possess the required authorization or role permissions to access this academic resource.
      </p>
      <div>
        <a href="{{ url_for('index') }}" class="btn btn-primary">
          <i class="bi bi-house-door-fill me-1"></i> Return to Home
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
